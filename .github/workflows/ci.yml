name: CareerBridge CI / CD Validation

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests & Migration Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: internship_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d internship_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci_test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: internship_db
      DATABASE_URL: postgresql://postgres:ci_test_password@localhost:5432/internship_db
      JWT_SECRET_KEY: ci_test_jwt_secret_for_github_actions_only_32chars
      API_V1_STR: /api/v1
      GOOGLE_CLIENT_ID: ci_test_google_client_id_for_github_actions_only
      ENVIRONMENT: test
      DEBUG: "False"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply Alembic migrations (Schema Integrity)
        run: alembic upgrade head

      - name: Run Pytest test suite
        run: pytest -q

      - name: Verify Backend Docker Build
        run: docker build -t careerbridge-backend:ci .

  frontend:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest test suite
        run: npm test -- --run

      - name: Build production bundle
        run: npm run build

      - name: Verify Frontend Docker Build
        run: docker build -t careerbridge-frontend:ci .

  e2e:
    name: Playwright End-to-End Workflow Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: internship_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d internship_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci_test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: internship_db
      DATABASE_URL: postgresql://postgres:ci_test_password@localhost:5432/internship_db
      JWT_SECRET_KEY: ci_test_jwt_secret_for_github_actions_only_32chars
      API_V1_STR: /api/v1
      GOOGLE_CLIENT_ID: ci_test_google_client_id_for_github_actions_only
      ENVIRONMENT: test
      DEBUG: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: frontend
        env:
          CI: true
          E2E_BASE_URL: http://localhost:5173
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

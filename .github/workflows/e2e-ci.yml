name: End-to-End Tests (Playwright)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: internship_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d internship_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: careerbridge_test_runner
      POSTGRES_PASSWORD: ci_test_runner_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: internship_test_db
      TEST_DATABASE_URL: postgresql://careerbridge_test_runner:ci_test_runner_password@localhost:5432/internship_test_db
      DATABASE_URL: postgresql://careerbridge_test_runner:ci_test_runner_password@localhost:5432/internship_test_db
      CAREERBRIDGE_TEST_MODE: "1"
      JWT_SECRET_KEY: ci_test_jwt_secret_for_github_actions_only
      API_V1_STR: /api/v1
      GOOGLE_CLIENT_ID: ci_test_google_client_id_for_github_actions_only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Provision CI test database role
        env:
          PGPASSWORD: ci_test_password
        run: |
          psql -h localhost -p 5432 -U postgres -d internship_test_db -v ON_ERROR_STOP=1 <<'EOF'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'careerbridge_test_runner') THEN
              CREATE ROLE careerbridge_test_runner WITH LOGIN PASSWORD 'ci_test_runner_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
            ELSE
              ALTER ROLE careerbridge_test_runner WITH LOGIN PASSWORD 'ci_test_runner_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
            END IF;
          END
          $$;
          GRANT ALL PRIVILEGES ON DATABASE internship_test_db TO careerbridge_test_runner;
          ALTER DATABASE internship_test_db OWNER TO careerbridge_test_runner;
          GRANT ALL ON SCHEMA public TO careerbridge_test_runner;
          ALTER SCHEMA public OWNER TO careerbridge_test_runner;
          REVOKE CONNECT ON DATABASE postgres FROM PUBLIC;
          REVOKE CONNECT ON DATABASE postgres FROM careerbridge_test_runner;
          EOF

      - name: Run database migrations
        working-directory: backend
        env:
          POSTGRES_USER: careerbridge_test_runner
          POSTGRES_PASSWORD: ci_test_runner_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: internship_test_db
          TEST_DATABASE_URL: postgresql://careerbridge_test_runner:ci_test_runner_password@localhost:5432/internship_test_db
          DATABASE_URL: postgresql://careerbridge_test_runner:ci_test_runner_password@localhost:5432/internship_test_db
          CAREERBRIDGE_TEST_MODE: "1"
          JWT_SECRET_KEY: ci_test_jwt_secret_for_github_actions_only
          API_V1_STR: /api/v1
          GOOGLE_CLIENT_ID: ci_test_google_client_id_for_github_actions_only
        run: alembic upgrade head

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: frontend
        env:
          CI: true
          E2E_BASE_URL: http://localhost:5173
          POSTGRES_USER: careerbridge_test_runner
          POSTGRES_PASSWORD: ci_test_runner_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: internship_test_db
          TEST_DATABASE_URL: postgresql://careerbridge_test_runner:ci_test_runner_password@localhost:5432/internship_test_db
          DATABASE_URL: postgresql://careerbridge_test_runner:ci_test_runner_password@localhost:5432/internship_test_db
          CAREERBRIDGE_TEST_MODE: "1"
          JWT_SECRET_KEY: ci_test_jwt_secret_for_github_actions_only
          API_V1_STR: /api/v1
          GOOGLE_CLIENT_ID: ci_test_google_client_id_for_github_actions_only
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
